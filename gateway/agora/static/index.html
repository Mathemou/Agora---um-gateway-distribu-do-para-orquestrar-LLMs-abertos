<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ágora · Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b4532a'/%3E%3Cpath d='M7 25h18M9 22V12m4.7 10V12m4.6 10V12m4.7 10V12M6 11l10-5 10 5z' stroke='%23fff' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f1eb;
  --surface: #fffdf9;
  --surface-2: #efeae1;
  --ink: #1f1b16;
  --muted: #6d665c;
  --faint: #a39b8f;
  --border: #e3dccf;
  --accent: #b4532a;
  --accent-ink: #ffffff;
  --accent-soft: #f6e4da;
  --user-bubble: #2a241e;
  --user-ink: #f7f2ea;
  --code-bg: #f0ebe2;
  --ok: #3f8a4f;
  --warn: #c48a1c;
  --bad: #c0392b;
  --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 8px 24px rgba(40, 30, 20, .06);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120f; --surface: #1c1915; --surface-2: #25211c; --ink: #ece6dc; --muted: #a59c8f;
    --faint: #6f675c; --border: #302b25; --accent: #e07a4a; --accent-ink: #1a120d; --accent-soft: #3a261c;
    --user-bubble: #ece6dc; --user-ink: #1c1915; --code-bg: #24201b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14120f; --surface: #1c1915; --surface-2: #25211c; --ink: #ece6dc; --muted: #a59c8f;
  --faint: #6f675c; --border: #302b25; --accent: #e07a4a; --accent-ink: #1a120d; --accent-soft: #3a261c;
  --user-bubble: #ece6dc; --user-ink: #1c1915; --code-bg: #24201b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans);
  display: grid; grid-template-columns: 300px 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- barra lateral ---------- */
aside {
  border-right: 1px solid var(--border); background: var(--surface-2);
  display: flex; flex-direction: column; min-height: 0; padding: 20px 16px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
.brand svg { flex: none; }
.brand h1 { font: 600 24px/1 var(--serif); letter-spacing: .01em; margin: 0; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; letter-spacing: .02em; }
.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--faint); padding: 0 6px; margin: 6px 0 8px;
}
#domains { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }
.domain {
  text-align: left; border: 1px solid transparent; background: transparent; border-radius: 12px;
  padding: 10px 12px; display: grid; gap: 3px; transition: background .15s, border-color .15s;
}
.domain:hover { background: var(--surface); }
.domain[aria-current="true"] { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
.domain .row { display: flex; align-items: center; gap: 8px; }
.domain .name { font-weight: 600; text-transform: capitalize; }
.domain .desc { color: var(--muted); font-size: 13px; line-height: 1.35; }
.domain .model { font: 12px var(--mono); color: var(--faint); }
.domain .load { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }

.settings { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); display: grid; gap: 12px; }
.field { display: grid; gap: 6px; padding: 0 6px; }
.field .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.field output { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.side-actions { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  padding: 8px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--faint); }
.btn.grow { flex: 1; justify-content: center; }
.gw-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 0 6px; }

/* ---------- área principal ---------- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header {
  display: flex; align-items: center; gap: 12px; padding: 14px 28px;
  border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 85%, transparent);
}
#menuBtn { display: none; }
header h2 { margin: 0; font: 600 19px/1.2 var(--serif); text-transform: capitalize; }
.chip {
  font: 12px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 10px; background: var(--surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
header .spacer { flex: 1; }

#scroll { flex: 1; overflow-y: auto; min-height: 0; }
#thread { max-width: 820px; margin: 0 auto; padding: 28px 28px 12px; display: flex; flex-direction: column; gap: 22px; }

.msg { display: flex; flex-direction: column; gap: 6px; animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg.user { align-items: flex-end; }
.msg.user .bubble {
  background: var(--user-bubble); color: var(--user-ink); border-radius: 18px 18px 4px 18px;
  padding: 10px 16px; max-width: 78%; white-space: pre-wrap; word-wrap: break-word;
}
.msg.assistant .bubble { max-width: 100%; word-wrap: break-word; }
.who { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.who .avatar {
  width: 22px; height: 22px; border-radius: 7px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font: 600 12px var(--serif);
}
.bubble p { margin: 0 0 .7em; } .bubble p:last-child { margin-bottom: 0; }
.bubble h3, .bubble h4 { font: 600 16px/1.3 var(--serif); margin: 1em 0 .4em; }
.bubble ul, .bubble ol { margin: 0 0 .7em; padding-left: 1.4em; }
.bubble li { margin: .2em 0; }
.bubble code { font: 13px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.codeblock { position: relative; margin: .4em 0 .8em; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.codeblock .bar {
  display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px;
  font: 11px var(--mono); color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; background: var(--code-bg); }
.codeblock pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
.mini { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 3px 8px; border-radius: 6px; }
.mini:hover { background: var(--surface); color: var(--ink); }

.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; align-items: center; }
.meta b { color: var(--muted); font-weight: 600; }
.meta .actions { margin-left: auto; display: flex; gap: 2px; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.caret > :last-child::after, .caret:empty::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; margin-left: 1px; }
.error { color: var(--bad); font-size: 13px; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); border-radius: 10px; padding: 8px 12px; }

/* estado vazio */
.empty { text-align: center; padding: 8vh 0 0; }
.empty h3 { font: 600 30px/1.2 var(--serif); margin: 14px 0 6px; }
.empty p { color: var(--muted); margin: 0 auto 26px; max-width: 460px; }
.suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; text-align: left; }
.suggestion {
  border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px;
  font-size: 14px; color: var(--ink); text-align: left; transition: border-color .15s, transform .15s;
}
.suggestion:hover { border-color: var(--accent); transform: translateY(-1px); }

/* compositor */
.composer-wrap { padding: 10px 28px 18px; }
.composer {
  max-width: 820px; margin: 0 auto; border: 1px solid var(--border); background: var(--surface);
  border-radius: 18px; box-shadow: var(--shadow); padding: 10px 10px 10px 16px; display: flex; gap: 10px; align-items: flex-end;
}
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
textarea {
  flex: 1; border: 0; outline: none; resize: none; background: transparent; color: var(--ink);
  font: inherit; max-height: 200px; min-height: 24px; padding: 6px 0; line-height: 1.5;
}
textarea::placeholder { color: var(--faint); }
#sendBtn {
  width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; flex: none; transition: opacity .15s;
}
#sendBtn:disabled { opacity: .35; cursor: default; }
.hint { max-width: 820px; margin: 8px auto 0; font-size: 12px; color: var(--faint); text-align: center; }
kbd { font: 11px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

.backdrop { display: none; }

@media (max-width: 860px) {
  body { grid-template-columns: 1fr; }
  aside {
    position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 20;
    transform: translateX(-100%); transition: transform .2s ease;
  }
  body.menu-open aside { transform: none; box-shadow: var(--shadow); }
  body.menu-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  #menuBtn { display: inline-flex; }
  header { padding: 12px 16px; }
  #thread { padding: 20px 16px 8px; }
  .composer-wrap { padding: 8px 16px 14px; }
  .msg.user .bubble { max-width: 90%; }
  header .chip { max-width: 40vw; }
}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M7 25h18M9 22V12m4.7 10V12m4.6 10V12m4.7 10V12M6 11l10-5 10 5z" stroke="var(--accent-ink)" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
    <div><h1>Ágora</h1><small>gateway de LLMs abertos</small></div>
  </div>

  <div class="section-label">Assistentes</div>
  <nav id="domains" aria-label="Assistentes"></nav>

  <div class="settings">
    <div class="field">
      <div class="top"><label for="maxTokens">Tamanho máx. da resposta</label><output id="maxTokensOut">padrão</output></div>
      <input id="maxTokens" type="range" min="0" max="2048" step="64" value="0" aria-describedby="maxTokensOut">
    </div>
    <div class="side-actions">
      <button class="btn grow" id="newChat" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nova conversa
      </button>
      <button class="btn" id="themeBtn" type="button" title="Alternar tema" aria-label="Alternar tema">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="gw-status"><span class="dot" id="gwDot"></span><span id="gwText">Conectando ao gateway…</span></div>
  </div>
</aside>
<div class="backdrop" id="backdrop"></div>

<main>
  <header>
    <button class="btn" id="menuBtn" type="button" aria-label="Abrir menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h2 id="title">—</h2>
    <span class="chip" id="modelChip" hidden></span>
    <span class="spacer"></span>
  </header>

  <div id="scroll"><div id="thread" aria-live="polite"></div></div>

  <div class="composer-wrap">
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Pergunte alguma coisa…" aria-label="Mensagem"></textarea>
      <button id="sendBtn" type="submit" aria-label="Enviar" disabled></button>
    </form>
    <div class="hint"><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> quebra linha · as respostas vêm token a token direto dos nós</div>
  </div>
</main>

<script>
"use strict";

// ---------------- estado ----------------
const HISTORY_LIMIT = 12;          // mensagens anteriores enviadas como contexto
const SEND_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
const SUGGESTIONS = {
  redes: ["O que é o three-way handshake do TCP?", "Qual a diferença entre TCP e UDP?", "Como funciona o DNS, passo a passo?", "Explique o controle de congestionamento do TCP."],
  programacao: ["Escreva uma função em Python que inverte uma string.", "Como ler um arquivo CSV em Python?", "Explique list comprehension com um exemplo.", "Como fazer uma requisição HTTP com httpx?"],
};

const store = {
  get(k, d) { try { const v = localStorage.getItem("agora:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("agora:" + k, JSON.stringify(v)); } catch {} },
};

let domains = {};                  // nome -> {description, node, model}
let current = store.get("domain", null);
let conversations = store.get("conversations", {}); // nome -> [{role, content, meta?}]
let controller = null;             // AbortController da requisição em andamento
let nodeHealth = {};               // nó -> "ok" | "warn" | "bad"
let nodeLoad = {};                 // nó -> snapshot da fila

const $ = (id) => document.getElementById(id);
const thread = $("thread"), scroller = $("scroll"), input = $("input"), sendBtn = $("sendBtn");
sendBtn.innerHTML = SEND_ICON;

// ---------------- markdown simples ----------------
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
}
function blocks(text) {
  const out = []; let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; } };
  for (const line of text.split("\n")) {
    let m;
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)/))) { flushPara(); flushList(); out.push("<h3>" + inline(m[1]) + "</h3>"); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul";
      flushPara(); if (list && list.tag !== tag) flushList();
      if (!list) list = { tag, items: [] };
      list.items.push(m[1]); continue;
    }
    if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += " " + line.trim(); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join("");
}
function md(src) {
  const text = esc(src);
  let html = "", last = 0;
  const re = /```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(```|$)/g;
  let m;
  while ((m = re.exec(text))) {
    if (m.index === last && m[0] === "") break;
    html += blocks(text.slice(last, m.index));
    const lang = m[1] || "código";
    html += `<div class="codeblock"><div class="bar"><span>${lang}</span><button class="mini" data-copy-code type="button">Copiar</button></div><pre><code>${m[2].replace(/\n$/, "")}</code></pre></div>`;
    last = re.lastIndex;
    if (m[3] === "") break;
  }
  html += blocks(text.slice(last));
  return html;
}

// ---------------- utilidades ----------------
const fmtMs = (v) => v == null ? "—" : v >= 1000 ? (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " s" : Math.round(v) + " ms";
const fmtNum = (v, d = 1) => v == null ? "—" : v.toLocaleString("pt-BR", { maximumFractionDigits: d });
function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
function toBottom(force) { if (force || nearBottom()) scroller.scrollTop = scroller.scrollHeight; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch {} t.remove();
  }
  const old = btn.textContent; btn.textContent = "Copiado!"; setTimeout(() => (btn.textContent = old), 1200);
}
function saveConversations() { store.set("conversations", conversations); }
function conv() { return (conversations[current] ||= []); }

// ---------------- renderização ----------------
function renderDomains() {
  const nav = $("domains"); nav.innerHTML = "";
  for (const [name, d] of Object.entries(domains)) {
    const b = el("button", "domain"); b.type = "button";
    b.setAttribute("aria-current", String(name === current));
    const health = nodeHealth[d.node] || "";
    const load = nodeLoad[d.node];
    const loadTxt = load ? `${load.active}/${load.max_concurrency}${load.waiting ? ` · fila ${load.waiting}` : ""}` : "";
    b.innerHTML = `<div class="row"><span class="dot ${health}" title="${health === "ok" ? "nó no ar" : health === "warn" ? "modelo ainda não baixado" : health === "bad" ? "nó fora do ar" : "verificando"}"></span><span class="name"></span><span class="load" title="em uso / vagas no nó">${loadTxt}</span></div><div class="desc"></div><div class="model"></div>`;
    b.querySelector(".name").textContent = name;
    b.querySelector(".desc").textContent = d.description || "";
    b.querySelector(".model").textContent = `${d.model} · ${d.node}`;
    b.onclick = () => { selectDomain(name); document.body.classList.remove("menu-open"); };
    nav.appendChild(b);
  }
}

function renderHeader() {
  const d = domains[current];
  $("title").textContent = current || "—";
  const chip = $("modelChip");
  if (d) { chip.hidden = false; chip.textContent = d.model; chip.title = `nó: ${d.node}`; } else chip.hidden = true;
  input.placeholder = current ? `Pergunte ao assistente de ${current}…` : "Pergunte alguma coisa…";
}

function renderEmpty() {
  const d = domains[current] || {};
  const box = el("div", "empty");
  box.innerHTML = `<svg width="46" height="46" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent-soft)"/><path d="M7 25h18M9 22V12m4.7 10V12m4.6 10V12m4.7 10V12M6 11l10-5 10 5z" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linejoin="round"/></svg><h3></h3><p></p><div class="suggestions"></div>`;
  box.querySelector("h3").textContent = current ? `Assistente de ${current}` : "Bem-vindo à Ágora";
  box.querySelector("p").textContent = d.description ? `${d.description}. Escolha uma sugestão ou escreva sua pergunta.` : "Escolha um assistente na barra lateral.";
  const sug = box.querySelector(".suggestions");
  for (const s of SUGGESTIONS[current] || ["Explique o que você sabe fazer.", "Me dê um exemplo prático do seu domínio."]) {
    const b = el("button", "suggestion"); b.type = "button"; b.textContent = s;
    b.onclick = () => send(s);
    sug.appendChild(b);
  }
  thread.appendChild(box);
}

function metaHtml(meta) {
  if (!meta) return "";
  const parts = [];
  if (meta.status === "cancelled") parts.push("<span>interrompida</span>");
  if (meta.ttft_ms != null) parts.push(`<span title="tempo até o primeiro token">1º token <b>${fmtMs(meta.ttft_ms)}</b></span>`);
  if (meta.gateway_tps != null) parts.push(`<span title="ritmo de geração visto pelo cliente"><b>${fmtNum(meta.gateway_tps)}</b> tok/s</span>`);
  if (meta.output_tokens) parts.push(`<span><b>${meta.output_tokens}</b> tokens</span>`);
  if (meta.e2e_ms != null) parts.push(`<span title="latência fim a fim">total <b>${fmtMs(meta.e2e_ms)}</b></span>`);
  if (meta.queue_wait_ms != null && meta.queue_wait_ms > 50) parts.push(`<span title="tempo esperando vaga no nó">fila <b>${fmtMs(meta.queue_wait_ms)}</b></span>`);
  if (meta.node) parts.push(`<span>${esc(meta.node)}</span>`);
  return parts.join("");
}

function addMessage(m, idx) {
  const wrap = el("div", "msg " + m.role);
  if (m.role === "user") {
    const b = el("div", "bubble"); b.textContent = m.content; wrap.appendChild(b);
  } else {
    wrap.appendChild(el("div", "who", `<span class="avatar">Á</span><span>${esc(m.meta?.model || domains[current]?.model || "assistente")}</span>`));
    const b = el("div", "bubble"); b.innerHTML = md(m.content || ""); wrap.appendChild(b);
    if (m.error) wrap.appendChild(el("div", "error", esc(m.error)));
    const meta = el("div", "meta", metaHtml(m.meta));
    const actions = el("span", "actions");
    const cp = el("button", "mini", "Copiar"); cp.type = "button"; cp.onclick = () => copy(m.content, cp);
    actions.appendChild(cp);
    if (idx === conv().length - 1) {
      const re = el("button", "mini", "Refazer"); re.type = "button"; re.dataset.regen = ""; re.onclick = regenerate; actions.appendChild(re);
    }
    if (m.content) meta.appendChild(actions);
    wrap.appendChild(meta);
  }
  thread.appendChild(wrap);
  return wrap;
}

function renderThread() {
  thread.innerHTML = "";
  const c = conv();
  if (!c.length) renderEmpty(); else c.forEach(addMessage);
  toBottom(true);
}

function selectDomain(name) {
  if (controller) return; // não troca no meio de uma resposta
  current = name; store.set("domain", name);
  renderDomains(); renderHeader(); renderThread(); input.focus();
}

// ---------------- envio e streaming (SSE via fetch) ----------------
function setBusy(busy) {
  sendBtn.innerHTML = busy ? STOP_ICON : SEND_ICON;
  sendBtn.setAttribute("aria-label", busy ? "Parar" : "Enviar");
  sendBtn.type = busy ? "button" : "submit";
  updateSendState();
}
function updateSendState() { sendBtn.disabled = !controller && (!input.value.trim() || !current); }

async function* readSSE(response) {
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      let event = "message", data = [];
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
      }
      if (data.length) { try { yield { event, data: JSON.parse(data.join("\n")) }; } catch {} }
    }
  }
}

async function send(text) {
  text = (text ?? input.value).trim();
  if (!text || !current || controller) return;
  input.value = ""; autosize();
  const c = conv();
  if (!c.length) thread.innerHTML = "";
  thread.querySelectorAll("[data-regen]").forEach(b => b.remove());
  c.push({ role: "user", content: text });
  addMessage(c[c.length - 1], c.length - 1);
  saveConversations();
  await stream();
}

async function regenerate() {
  if (controller) return;
  const c = conv();
  if (c.length && c[c.length - 1].role === "assistant") c.pop();
  saveConversations(); renderThread();
  await stream();
}

async function stream() {
  const domain = current, c = conv();
  const history = c.filter(m => m.content).slice(-HISTORY_LIMIT).map(({ role, content }) => ({ role, content }));
  while (history.length && history[0].role !== "user") history.shift();

  const msg = { role: "assistant", content: "", meta: { model: domains[domain]?.model } };
  c.push(msg);

  // bolha "pensando"
  const wrap = el("div", "msg assistant");
  wrap.appendChild(el("div", "who", `<span class="avatar">Á</span><span>${esc(msg.meta.model || "assistente")}</span>`));
  const bubble = el("div", "bubble"); wrap.appendChild(bubble);
  const status = el("div", "status", `<span class="typing"><span></span><span></span><span></span></span><span>Enviando ao gateway…</span>`);
  wrap.appendChild(status);
  thread.appendChild(wrap); toBottom(true);

  controller = new AbortController(); setBusy(true);
  const maxTokens = +$("maxTokens").value;
  const body = { domain, messages: history };
  if (maxTokens > 0) body.max_tokens = maxTokens;

  let pending = false;
  const paint = () => { pending = false; bubble.innerHTML = md(msg.content); bubble.classList.add("caret"); toBottom(); };

  try {
    const res = await fetch("/v1/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body), signal: controller.signal,
    });
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try { const j = await res.json(); detail = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch {}
      if (res.status === 503) detail += " — o nó está ocupado; tente de novo em alguns segundos.";
      throw new Error(detail);
    }
    for await (const { event, data } of readSSE(res)) {
      if (event === "meta") {
        Object.assign(msg.meta, { node: data.node, model: data.model });
        status.lastElementChild.textContent = data.queue_position > 0
          ? `Na fila do ${data.node} (posição ${data.queue_position})…`
          : `Gerando em ${data.node}…`;
      } else if (event === "token") {
        if (status.isConnected) status.remove();
        msg.content += data.text;
        if (!pending) { pending = true; requestAnimationFrame(paint); }
      } else if (event === "done") {
        Object.assign(msg.meta, data);
      } else if (event === "error") {
        msg.error = "O nó falhou: " + (data.message || "erro desconhecido");
      }
    }
    if (!msg.meta.status && !msg.error) msg.error = "A conexão terminou antes do fim da resposta.";
  } catch (err) {
    if (err.name === "AbortError") msg.meta.status = "cancelled";
    else msg.error = err.message === "Failed to fetch" ? "Não consegui falar com o gateway. Ele está rodando? (docker compose ps)" : err.message;
  } finally {
    controller = null; setBusy(false);
    if (!msg.content && !msg.error && msg.meta.status === "cancelled") c.pop();
    if (current === domain) {
      wrap.remove();
      if (c.includes(msg)) addMessage(msg, c.indexOf(msg));
      toBottom();
    }
    saveConversations();
    refreshStatus();
    input.focus();
  }
}

// ---------------- estado do gateway e dos nós ----------------
async function refreshStatus() {
  const dot = $("gwDot"), txt = $("gwText");
  try {
    const [h, n] = await Promise.all([fetch("/health").then(r => r.json()), fetch("/v1/nodes").then(r => r.json())]);
    nodeHealth = {};
    for (const [node, s] of Object.entries(h.nodes || {})) nodeHealth[node] = !s.up ? "bad" : s.missing?.length ? "warn" : "ok";
    nodeLoad = Object.fromEntries((n || []).map(s => [s.node, s]));
    const up = Object.values(nodeHealth).filter(v => v === "ok").length, total = Object.keys(nodeHealth).length;
    dot.className = "dot " + (h.status === "ok" ? "ok" : up ? "warn" : "bad");
    txt.textContent = h.status === "ok" ? `Gateway no ar · ${total} nós prontos` : `${up} de ${total} nós prontos`;
  } catch {
    dot.className = "dot bad"; txt.textContent = "Gateway inacessível";
  }
  renderDomains();
}

async function init() {
  try {
    domains = await fetch("/v1/domains").then(r => r.json());
  } catch {
    thread.innerHTML = ""; thread.appendChild(el("div", "error", "Não consegui carregar os assistentes. Verifique se o gateway está rodando em http://localhost:8000."));
    return;
  }
  if (!domains[current]) current = Object.keys(domains)[0] || null;
  renderDomains(); renderHeader(); renderThread();
  refreshStatus(); setInterval(() => { if (!document.hidden) refreshStatus(); }, 5000);
  input.focus();
}

// ---------------- eventos ----------------
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; updateSendState(); }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
sendBtn.addEventListener("click", (e) => { if (controller) { e.preventDefault(); controller.abort(); } });
$("newChat").onclick = () => { if (controller) return; conversations[current] = []; saveConversations(); renderThread(); input.focus(); };
$("maxTokens").addEventListener("input", (e) => {
  const v = +e.target.value; $("maxTokensOut").textContent = v ? `${v} tokens` : "padrão"; store.set("maxTokens", v);
});
{ const v = store.get("maxTokens", 0); $("maxTokens").value = v; $("maxTokensOut").textContent = v ? `${v} tokens` : "padrão"; }
$("menuBtn").onclick = () => document.body.classList.toggle("menu-open");
$("backdrop").onclick = () => document.body.classList.remove("menu-open");
thread.addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy-code]");
  if (b) copy(b.closest(".codeblock").querySelector("code").textContent, b);
});
// tema: claro / escuro / automático
const themes = ["auto", "light", "dark"];
function applyTheme(t) { if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; $("themeBtn").title = `Tema: ${{ auto: "automático", light: "claro", dark: "escuro" }[t]}`; }
let theme = store.get("theme", "auto"); applyTheme(theme);
$("themeBtn").onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(theme); };

init();
</script>
</body>
