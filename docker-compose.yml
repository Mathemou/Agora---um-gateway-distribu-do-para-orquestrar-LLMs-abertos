# Ágora – Jogo da Imitação: gateway + 2 nós de inferência Ollama (somente CPU).
#   node-impostor → domínio "impostor" (a IA que joga disfarçada de humano)
#   node-mestre   → domínio "mestre"   (o narrador da partida)
# Orçamento de memória (padrão): 4 GB (impostor) + 3 GB (mestre) + 512 MB (gateway) ≈ 7,5 GB,
# abaixo dos 8 GB combinados. Ajuste no .env (veja .env.example).
#
#   docker compose up -d --build      # sobe tudo e baixa os modelos
#   docker compose logs -f gateway    # depois abra http://localhost:8000

name: agora

x-ollama-node: &ollama-node
  image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
  restart: unless-stopped
  environment:
    OLLAMA_NUM_PARALLEL: ${NODE_PARALLEL:-2}   # requisições simultâneas por nó
    OLLAMA_MAX_LOADED_MODELS: "1"              # um modelo por nó
    OLLAMA_KEEP_ALIVE: "-1"                    # não descarrega o modelo
    OLLAMA_CONTEXT_LENGTH: "2048"
  mem_limit: ${NODE_MEM_LIMIT:-3g}
  cpus: ${NODE_CPUS:-2}
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  node-impostor:
    <<: *ollama-node
    # A IA impostora é quem mais precisa de CPU (o modelo é maior e ela fala mais).
    cpus: ${IMPOSTOR_CPUS:-4}
    mem_limit: ${IMPOSTOR_MEM_LIMIT:-4g}
    volumes:
      - ollama-impostor:/root/.ollama
    ports:
      - "21434:11434"   # acesso direto ao nó, só para depuração

  node-mestre:
    <<: *ollama-node
    volumes:
      - ollama-mestre:/root/.ollama
    ports:
      - "21435:11434"

  # Baixa os modelos em cada nó (roda uma vez e termina).
  pull-models:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      node-impostor: {condition: service_healthy}
      node-mestre: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        OLLAMA_HOST=http://node-impostor:11434 ollama pull ${MODEL_IMPOSTOR:-qwen2.5:3b} &&
        OLLAMA_HOST=http://node-mestre:11434 ollama pull ${MODEL_MESTRE:-qwen2.5:0.5b}
    restart: "no"

  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on:
      pull-models: {condition: service_completed_successfully}
    environment:
      GATEWAY_CONFIG: /config/gateway.yaml
      MODEL_IMPOSTOR: ${MODEL_IMPOSTOR:-qwen2.5:3b}
      MODEL_MESTRE: ${MODEL_MESTRE:-qwen2.5:0.5b}
      NODE_PARALLEL: ${NODE_PARALLEL:-2}
      GAME_MIN_PLAYERS: ${GAME_MIN_PLAYERS:-3}
      GAME_DISCUSSION_S: ${GAME_DISCUSSION_S:-150}
      GAME_IMPOSTOR_DOMAIN: ${GAME_IMPOSTOR_DOMAIN:-impostor}
      # Groq (opcional): modelos abertos grandes na nuvem, domínios impostor-groq e mestre-groq.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MODEL_GROQ: ${MODEL_GROQ:-qwen/qwen3.8-27b}
      GAME_MASTER_DOMAIN: ${GAME_MASTER_DOMAIN:-mestre}
      # Chave da API do Claude (opcional: só para o domínio impostor-claude).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_CLAUDE: ${MODEL_CLAUDE:-claude-haiku-5-5}
      # OpenCode Go (opcional: só para o domínio impostor-opencode).
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      MODEL_OPENCODE: ${MODEL_OPENCODE:-glm-5.3-flash}
      # Trilha Desempenho: vários nós para a IA, política de balanceamento e de fila.
      IMPOSTOR_NODES: ${IMPOSTOR_NODES:-node-impostor}
      NODE_IMPOSTOR2_URL: ${NODE_IMPOSTOR2_URL:-http://host.docker.internal:11435}
      NODE2_PARALLEL: ${NODE2_PARALLEL:-1}
      BALANCE_POLICY: ${BALANCE_POLICY:-peak_ewma}
      QUEUE_POLICY: ${QUEUE_POLICY:-fifo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    mem_limit: 512m

volumes:
  ollama-impostor:
  ollama-mestre:
