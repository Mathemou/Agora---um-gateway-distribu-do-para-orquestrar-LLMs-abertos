# Gateway apontando para o nó FALSO (agora.fake_node), sem gastar CPU com LLM.
# Dá para jogar uma partida inteira (a IA "fala" frases prontas) e testar
# protocolo, filas, WebSocket e o gerador de carga.
#   python -m agora.fake_node --port 11435   (dentro de gateway/)

metrics_log: logs/requests-fake.jsonl
keep_alive: "5m"

nodes:
  node-impostor:
    url: http://127.0.0.1:11435
    max_concurrency: 1
    max_queue: 32
  node-mestre:
    url: http://127.0.0.1:11435
    max_concurrency: 1
    max_queue: 32

domains:
  impostor:
    description: IA impostora (nó falso)
    node: node-impostor
    model: qwen2.5:1.5b
    system_prompt: Você é o jogador {alias}. Outros jogadores são {others}.
    options: {num_predict: 10}
  mestre:
    description: O Mestre (nó falso)
    node: node-mestre
    model: qwen2.5:0.5b
    system_prompt: Você é o Mestre do Jogo da Imitação.
    options: {num_predict: 14}

game:
  min_players: ${GAME_MIN_PLAYERS:-3}
  discussion_s: ${GAME_DISCUSSION_S:-90}
  vote_s: 30
  reveal_s: 6
  log_path: logs/games-fake.jsonl
