# Gateway apontando para o nó FALSO (agora.fake_node), sem gastar CPU com LLM.
# Útil para testar o protocolo, a fila e o gerador de carga.
#   python -m agora.fake_node --port 11435   (dentro de gateway/)

metrics_log: logs/requests-fake.jsonl
keep_alive: "5m"

nodes:
  node-redes:
    url: http://127.0.0.1:11435
    max_concurrency: 1
    max_queue: 32
  node-prog:
    url: http://127.0.0.1:11435
    max_concurrency: 1
    max_queue: 32

domains:
  redes:
    description: Assistente de Redes (nó falso)
    node: node-redes
    model: qwen2.5:0.5b
    system_prompt: Você é o monitor de Redes.
    options: {num_predict: 40}
  programacao:
    description: Assistente de programação (nó falso)
    node: node-prog
    model: qwen2.5-coder:0.5b
    system_prompt: Você é um assistente de programação.
    options: {num_predict: 40}
